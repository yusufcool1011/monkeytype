name: Deploy Monkeytype to GitHub Pages

on:
  push:
    branches:
      - master # Adjust to 'main' if your default branch is main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11 # Matches current repository version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Frontend Workspace
        run: pnpm --filter @monkeytype/frontend build
        env:
          PUBLIC_URL: /monkeytype

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist # Monkeytype's static output lives inside the frontend subfolder
          branch: gh-pages
